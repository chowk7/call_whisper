name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The original repository was empty. Generate Flutter's standard Android
      # Gradle wrapper in CI, then put our native implementation back in place.
      # Once Flutter is available locally, these generated platform files can be
      # committed and this bootstrap step removed.
      - name: Generate Android platform project
        run: |
          mkdir -p /tmp/call-whisper-native
          cp android/app/src/main/AndroidManifest.xml /tmp/call-whisper-native/AndroidManifest.xml
          cp -R android/app/src/main/cpp /tmp/call-whisper-native/
          cp -R android/app/src/main/kotlin /tmp/call-whisper-native/
          flutter create --platforms=android --project-name=call_whisper --org=com.callwhisper .
          rm -rf android/app/src/main/cpp android/app/src/main/kotlin
          cp /tmp/call-whisper-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R /tmp/call-whisper-native/cpp android/app/src/main/
          cp -R /tmp/call-whisper-native/kotlin android/app/src/main/
          # file_picker's current Android dependency requires API 36.
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          # flutter create does not know about our whisper.cpp CMake target.
          # Register it so libcall_whisper.so is packaged into the APK.
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }
          EOF

      - name: Resolve Flutter packages
        run: |
          flutter pub get
          # file_picker 8.x fixes its Android library compile SDK at 34.
          # Its transitive lifecycle dependency now requires API 36.
          find "$PUB_CACHE/hosted" -path '*/file_picker-*/android/build.gradle' -exec sed -i 's/compileSdk 34/compileSdk 36/' {} \;

      - name: Fetch whisper.cpp native source
        run: bash scripts/bootstrap_native.sh

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-whisper-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
